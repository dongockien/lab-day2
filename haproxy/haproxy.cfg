# ======================= LAB (a): HAProxy ở L4 (mode tcp) =======================
global
    log stdout format raw local0
    maxconn 4000

defaults
    log                 global
    mode                tcp
    option              tcplog
    timeout connect     3s      # <<< dòng "cứu hệ thống": SYN bị bỏ thì bỏ cuộc sau 3s, không đợi hàng chục giây
    timeout client      30s
    timeout server      30s
    timeout check       2s
    retries             3
    option              redispatch 1   # mỗi lần retry kết nối là đổi sang server KHÁC (mặc định -1: chỉ đổi ở lần cuối)

# --- Cổng 8081: L4 thuần, cân bằng 3 bản sao API ---
frontend ft_api_tcp
    bind :8081
    default_backend bk_api

backend bk_api
    balance roundrobin
    default-server inter 2s fall 3 rise 2 init-addr libc,none
    server api1 api1:8000 check
    server api2 api2:8000 check
    server api3 api3:8000 check

# --- Cổng 9443: TLS passthrough tới nginx (L4 KHÔNG giải mã TLS) ---
frontend ft_tls_passthrough
    bind :9443
    default_backend bk_nginx_tls

backend bk_nginx_tls
    balance roundrobin
    default-server inter 2s fall 3 rise 2 init-addr libc,none
    server nginx1 nginx:443 check
    server nginx2 nginx2:443 check

# --- Cổng 8090: mô hình thật của hệ lớn: L4 (HAProxy) -> L7 (nginx x2) -> API ---
frontend ft_chain
    bind :8090
    default_backend bk_nginx_http

backend bk_nginx_http
    balance leastconn
    default-server inter 2s fall 3 rise 2 init-addr libc,none
    server nginx1 nginx:80 check
    server nginx2 nginx2:80 check

# --- Trang thống kê (HTTP): xem UP/DOWN, cột Retr/Redis ---
frontend stats
    mode http
    bind :8404
    timeout client 10s
    stats enable
    stats uri /stats
    stats refresh 2s
