# ======================= LAB (b): nginx ở L7 =======================
worker_processes auto;
events { worker_connections 1024; }

http {
    # Log có đủ mốc thời gian để đọc: ct = thời gian connect tới upstream, ut = thời gian upstream trả lời
    log_format lab '$time_iso8601 rid=$req_id client=$remote_addr '
                   'uri=$uri status=$status upstream=$upstream_addr '
                   'ct=$upstream_connect_time ut=$upstream_response_time rt=$request_time';
    access_log /dev/stdout lab;
    error_log  /dev/stderr warn;

    # Dùng X-Request-ID của client nếu có, không thì nginx tự sinh
    map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

    # Nâng cấp WebSocket: chỉ gửi "upgrade" khi client yêu cầu
    map $http_upgrade $connection_upgrade { default upgrade; "" close; }

    # Nhóm 1: /api -> api1, api2
    upstream api_pool {
        server api1:8000 max_fails=2 fail_timeout=10s;   # health check THỤ ĐỘNG (nginx OSS không có active check)
        server api2:8000 max_fails=2 fail_timeout=10s;
        keepalive 16;                                    # giữ kết nối tới upstream, đỡ bắt tay TCP lại
    }
    # Nhóm 2: /ai -> api3, có api1 làm dự phòng (backup)
    upstream ai_pool {
        server api3:8000 max_fails=2 fail_timeout=10s;
        server api1:8000 backup;                         # chỉ nhận khi api3 hỏng
        keepalive 16;
    }

    server {
        listen 80;
        listen 443 ssl;                                  # nginx KẾT THÚC TLS tại đây (termination)
        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        proxy_http_version 1.1;
        proxy_set_header Connection "";                  # cần cho keepalive tới upstream
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $req_id;

        # ---- Các timeout: đây là phần quan trọng nhất của bài ----
        proxy_connect_timeout 3s;                        # SYN bị bỏ -> bỏ cuộc sau 3s
        proxy_read_timeout    10s;
        proxy_send_timeout    10s;
        # Khi lỗi KẾT NỐI hoặc timeout -> thử server khác (tối đa 2 lần, tối đa 8s tổng)
        proxy_next_upstream         error timeout http_502 http_503;
        proxy_next_upstream_tries   2;
        proxy_next_upstream_timeout 8s;
        # Lưu ý: nginx KHÔNG tự retry POST/PATCH (không idempotent) trừ khi khai báo "non_idempotent"

        location /api/ {
            proxy_pass http://api_pool;
        }

        location /ai/ {
            proxy_pass http://ai_pool;
            proxy_read_timeout 60s;                      # suy luận AI có thể lâu hơn
        }

        # SSE (chat AI trả từng token): phải TẮT buffering và nới read timeout
        location /ai/stream {
            proxy_pass http://ai_pool;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # WebSocket: cần HTTP/1.1 + Upgrade + Connection + read timeout dài
        # (API demo không hỗ trợ WebSocket; block này để bạn đọc và đối chiếu cấu hình)
        location /ws/ {
            proxy_pass http://ai_pool;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /nginx-health { return 200 "ok\n"; }
    }
}
